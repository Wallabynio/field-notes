<!DOCTYPE html>
<html lang="en-AU">
<head>

<style>
/* Field Notes design system tokens. Layout: one phone column, bottom tabs; wider screens centre the column. */
:root {
  --ground:#f4efe6; --surface:#fbf8f2; --sunken:#e7dfd0; --ink:#2b2a26; --ink-muted:#5e5a52; --on-ink:#f4efe6; --line:#dcd3c3;
  --work:#36699d; --work-soft:#d3e3f0; --work-label:#2f5e8c; --work-track:#b7cfe5;
  --study:#6e52b0; --study-soft:#e4dcf1; --study-label:#5b4790; --study-track:#cfc2e8;
  --health:#4a7c3d; --health-soft:#d8e8d0; --health-label:#3f6634; --health-track:#bcd6af;
  --money:#9a6b1a; --money-soft:#f1e2c4; --money-label:#7a5418; --money-track:#e6cfa0;
  --rest:#766d5f; --rest-soft:#eae3d6; --rest-label:#5e5a52; --rest-track:#dcd3c3;
  --bay-water:#6d93b8; --bay-land:#7e9c70; --bay-sun:#b9893b; --bay-sun-fill:#f1e2c4;
  --scrim: rgba(43,42,38,.45);
  --font-sans: Nunito, ui-rounded, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground:#1b1a17; --surface:#25231f; --sunken:#2f2c27; --ink:#f1ece2; --ink-muted:#b8b0a2; --on-ink:#1b1a17; --line:#3a3630;
  --work:#7faad6; --work-soft:#22324a; --work-label:#a9c8ea; --work-track:#31476a;
  --study:#a992dd; --study-soft:#2e2742; --study-label:#c9b8f0; --study-track:#423860;
  --health:#8dbe7e; --health-soft:#243822; --health-label:#b4d9a8; --health-track:#34502f;
  --money:#d9a955; --money-soft:#3b301b; --money-label:#ebc987; --money-track:#574627;
  --rest:#9c9385; --rest-soft:#2f2c27; --rest-label:#b8b0a2; --rest-track:#3a3630;
  --bay-water:#5c7fa3; --bay-land:#6c8a5f; --bay-sun:#c99a4c; --bay-sun-fill:#3b301b; --scrim: rgba(0,0,0,.6);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --ground:#1b1a17; --surface:#25231f; --sunken:#2f2c27; --ink:#f1ece2; --ink-muted:#b8b0a2; --on-ink:#1b1a17; --line:#3a3630;
  --work:#7faad6; --work-soft:#22324a; --work-label:#a9c8ea; --work-track:#31476a;
  --study:#a992dd; --study-soft:#2e2742; --study-label:#c9b8f0; --study-track:#423860;
  --health:#8dbe7e; --health-soft:#243822; --health-label:#b4d9a8; --health-track:#34502f;
  --money:#d9a955; --money-soft:#3b301b; --money-label:#ebc987; --money-track:#574627;
  --rest:#9c9385; --rest-soft:#2f2c27; --rest-label:#b8b0a2; --rest-track:#3a3630;
  --bay-water:#5c7fa3; --bay-land:#6c8a5f; --bay-sun:#c99a4c; --bay-sun-fill:#3b301b; --scrim: rgba(0,0,0,.6);
  color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; background: var(--ground); }
main { flex: 1; padding: 18px 20px 120px; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }

/* header */
.bay { position: relative; height: calc(150px + env(safe-area-inset-top)); background: var(--sunken); display: flex; flex-direction: column; justify-content: flex-end; padding: 0 22px 16px; overflow: hidden; }
.bay svg { position: absolute; right: 0; top: 0; }
.bay .water { stroke: var(--bay-water); } .bay .land { stroke: var(--bay-land); } .bay .sun { stroke: var(--bay-sun); fill: var(--bay-sun-fill); }
.bay-words { position: relative; display: flex; flex-direction: column; gap: 2px; }
.bay-date { font-size: 13px; font-weight: 700; color: var(--ink-muted); }
.bay-greeting { font-size: 28px; line-height: 32px; font-weight: 900; letter-spacing: -.01em; }
.page-title { font-size: 28px; line-height: 32px; font-weight: 900; }

/* text */
.eyebrow { font-size: 12px; line-height: 16px; font-weight: 800; letter-spacing: .02em; text-transform: uppercase; }
.heading { font-size: 15px; line-height: 20px; font-weight: 900; }
.title { font-size: 22px; line-height: 28px; font-weight: 900; }
.body { font-size: 14px; line-height: 20px; color: var(--ink-muted); }
.caption { font-size: 12px; line-height: 16px; font-weight: 700; color: var(--ink-muted); }
.fig { font-family: var(--font-mono); font-size: 16px; line-height: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.fig-sm { font-family: var(--font-mono); font-size: 13px; line-height: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
.fig-lg { font-family: var(--font-mono); font-size: 22px; line-height: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
.l-work { color: var(--work-label); } .l-study { color: var(--study-label); } .l-health { color: var(--health-label); } .l-money { color: var(--money-label); } .l-rest { color: var(--rest-label); }

/* cards */
.card { background: var(--surface); border-radius: 28px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.a-work { background: var(--work-soft); } .a-study { background: var(--study-soft); } .a-health { background: var(--health-soft); } .a-money { background: var(--money-soft); } .a-rest { background: var(--rest-soft); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 4px; }
.tile-title { font-size: 17px; line-height: 22px; font-weight: 800; }
.tile-detail { font-size: 13px; line-height: 18px; color: var(--ink-muted); }

/* rings */
.ringstack { display: flex; gap: 18px; align-items: center; }
.ringstack svg { flex-shrink: 0; display: block; }
.legend { display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 0; }
.figure { display: flex; flex-direction: column; gap: 1px; }
.arc { stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
.ring-c { fill: var(--ink); font-family: var(--font-sans); font-weight: 900; }
.ring-s { fill: var(--ink-muted); font-family: var(--font-sans); font-weight: 700; }

/* bars */
.bar { display: flex; flex-direction: column; gap: 6px; }
.bar-head { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; line-height: 18px; font-weight: 800; }
.track { height: 8px; border-radius: 999px; overflow: hidden; }
.bar.lg .track { height: 10px; }
.fill { height: 100%; border-radius: 999px; transition: width .4s ease; }
.t-work { background: var(--work-soft); } .t-study { background: var(--study-soft); } .t-health { background: var(--health-soft); } .t-money { background: var(--money-soft); } .t-rest { background: var(--rest-soft); }
.on-soft.t-work { background: var(--work-track); } .on-soft.t-study { background: var(--study-track); } .on-soft.t-health { background: var(--health-track); } .on-soft.t-money { background: var(--money-track); } .on-soft.t-rest { background: var(--rest-track); }
.f-work { background: var(--work); } .f-study { background: var(--study); } .f-health { background: var(--health); } .f-money { background: var(--money); } .f-rest { background: var(--rest); } .f-neutral { background: var(--line); } .f-commute { background: var(--work-track); }
.segs { display: grid; gap: 4px; }
.seg { height: 8px; border-radius: 999px; }

/* timeline */
.tl-wrap { position: relative; }
.tl { display: flex; height: 22px; border-radius: 999px; overflow: hidden; gap: 2px; }
.tl-now { position: absolute; top: -5px; width: 3px; height: 32px; margin-left: -1px; background: var(--ink); border-radius: 2px; }
.tl-ends { display: flex; justify-content: space-between; }
.legend-row { display: flex; gap: 14px; flex-wrap: wrap; }
.dot { width: 10px; height: 10px; border-radius: 999px; display: inline-block; vertical-align: -1px; margin-right: 5px; }

/* buttons */
.btn { min-height: 52px; padding: 0 22px; border: none; border-radius: 999px; font-size: 15px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-primary { background: var(--ink); color: var(--on-ink); }
.btn-secondary { background: var(--sunken); color: var(--ink); }
.btn-small { min-height: 44px; padding: 0 16px; font-size: 14px; }
.btn-row { display: flex; gap: 10px; } .btn-row .btn { flex: 1; }
.btn:focus-visible, .nav button:focus-visible, .chip:focus-visible, .link-btn:focus-visible { outline: 2px solid var(--work); outline-offset: 2px; }
.chip { min-height: 44px; padding: 0 16px; border-radius: 999px; border: none; background: var(--sunken); color: var(--ink); font-weight: 800; font-size: 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.link-btn { background: none; border: none; color: var(--ink-muted); font-weight: 700; font-size: 13px; cursor: pointer; min-height: 44px; padding: 0 4px; }

/* lists */
.list { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: none; }
.row-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row-title { font-size: 14px; font-weight: 800; }
.row-sub { font-size: 12px; color: var(--ink-muted); font-weight: 700; overflow-wrap: anywhere; }
.empty { font-size: 14px; color: var(--ink-muted); padding: 6px 0; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; font-size: 14px; }
.kv .fig-sm { text-align: right; }
.kv .total { font-weight: 900; border-top: 1px solid var(--line); padding-top: 6px; }

/* day agenda */
.agenda { display: flex; flex-direction: column; gap: 2px; }
.ag-row { display: grid; grid-template-columns: 52px 6px minmax(0, 1fr) auto; gap: 12px; align-items: stretch; padding: 8px 10px; border-radius: 16px; }
.ag-row.now { background: var(--sunken); }
.ag-time { font-family: var(--font-mono); font-size: 13px; line-height: 18px; font-weight: 600; font-variant-numeric: tabular-nums; padding-top: 1px; }
.ag-pill { border-radius: 999px; min-height: 36px; }
.ag-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.ag-title { font-size: 14px; line-height: 20px; font-weight: 800; }
.ag-sub { font-size: 12px; line-height: 16px; font-weight: 700; color: var(--ink-muted); }
.ag-state { align-self: center; font-size: 12px; font-weight: 800; color: var(--ink-muted); white-space: nowrap; }
.ag-row.past .ag-title, .ag-row.past .ag-time { color: var(--ink-muted); }
.ag-row.past .ag-pill { opacity: .45; }
.ag-badge { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; background: var(--ink); color: var(--on-ink); }

/* nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; }
.nav-inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--surface); border-radius: 24px 24px 0 0; padding: 10px 4px calc(16px + env(safe-area-inset-bottom)); }
.nav button { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: var(--ink-muted); font-size: 11px; font-weight: 700; min-height: 48px; cursor: pointer; }
.nav button[aria-current="page"] { color: var(--ink); font-weight: 800; }

/* sheet */
.sheet-scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 10; display: none; align-items: flex-end; justify-content: center; }
.sheet-scrim.open { display: flex; }
.sheet { width: 100%; max-width: 480px; max-height: 92%; overflow-y: auto; background: var(--ground); border-radius: 28px 28px 0 0; padding: 22px 20px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 800; }
.field input, .field select { min-height: 48px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); padding: 0 14px; font-size: 16px; }
.field input:focus, .field select:focus { outline: none; border-color: var(--work); }
.field .hint { font-size: 12px; color: var(--ink-muted); font-weight: 700; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.notice { font-size: 13px; font-weight: 700; color: var(--money-label); background: var(--money-soft); border-radius: 14px; padding: 10px 14px; }
.toast { position: fixed; left: 50%; bottom: 110px; transform: translateX(-50%); background: var(--ink); color: var(--on-ink); padding: 10px 18px; border-radius: 999px; font-weight: 800; font-size: 14px; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
.toast.show { opacity: 1; }
.login { padding: 24px 20px 60px; display: flex; flex-direction: column; gap: 16px; }
.login[hidden], .app-main[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { .fill, .arc, .toast { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="bay">
    <svg aria-hidden="true" width="390" height="150" viewBox="0 0 390 150">
      <circle class="sun" cx="318" cy="46" r="18" stroke-width="2"></circle>
      <path class="land" d="M0 98 C60 84 110 92 170 86 C240 78 300 90 390 82" fill="none" stroke-width="2" stroke-linecap="round"></path>
      <path class="water" d="M0 112 C70 106 140 114 210 108 C280 102 330 110 390 104" fill="none" stroke-width="2" stroke-linecap="round"></path>
      <path class="water" d="M30 124 C90 120 150 126 220 122 C290 118 340 124 390 120" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 6"></path>
      <path class="land" d="M250 86 v-16 M244 76 l6 -10 l6 10 M262 88 v-12 M257 80 l5 -8 l5 8" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    <div class="bay-words">
      <span class="bay-date" id="hdr-date">Today</span>
      <h1 class="bay-greeting" id="hdr-greeting">Morning, Istvan</h1>
    </div>
  </header>
  <section class="login" id="login" hidden aria-labelledby="login-title">
    <h2 class="page-title" id="login-title">Sign in</h2>
    <p class="body" style="margin:0">Your entries are private to your account and sync between your phone and laptop.</p>
    <form id="f-login" style="display:flex;flex-direction:column;gap:14px" novalidate>
      <div class="field"><label for="l-email">Email</label><input id="l-email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="l-pass">Password</label><input id="l-pass" type="password" autocomplete="current-password" minlength="8" required><span class="hint">At least 8 characters.</span></div>
      <p class="caption" id="l-err" role="alert" style="margin:0;color:var(--money-label)"></p>
      <button type="submit" class="btn btn-primary">Sign in</button>
      <button type="button" class="btn btn-secondary" id="l-signup">First time? Create my account</button>
    </form>
  </section>
  <main id="view" class="app-main" aria-live="polite"></main>
</div>

<nav class="nav" aria-label="Main"><div class="nav-inner" id="nav"></div></nav>

<div class="sheet-scrim" id="sheet-scrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  'use strict';

  /* ---------------- Plan constants (from Base Plan v1.5) ---------------- */
  var APP_VERSION = '0.3.0';
  var PLAN_START = '2026-11-08';               // Sunday, week 1 day 1
  var NORMAL_MIN = 350, HOMEWARD_MIN = 60;      // 5 h 50 + 1 h per day
  var DRIVE_TARGET_MIN = NORMAL_MIN + HOMEWARD_MIN; // 6 h 50
  var WEEK_DRIVE_MIN = DRIVE_TARGET_MIN * 7;   // 47 h 50
  var WEEK_STUDY_MIN = 1200;                    // 20 h
  var DAY_TARGET = 250, DAY_BREAKEVEN = 238.48;  // receipts after platform fees
  var WEEK_TARGET = DAY_TARGET * 7;              // $1,750
  var TAX_WEEKLY = 247.03;                       // at target: GST 103.12 + income tax 123.29 + Medicare 20.62
  var TAX_DAILY = TAX_WEEKLY / 7;
  var TAX_MARGINAL = 1 / 11 + 0.30 / 1.1 + 0.02 / 1.1; // 38.2% of each dollar above (or below) target
  var DAY_START = 330, DAY_END = 1290;          // 5:30 am – 9:30 pm
  var BUDGET_BIZ = [
    ['Splend', 449.01], ['Charging ($35 × 7)', 245], ['Car washes (White Diamond, IMO + vacuum)', 52.50], ['Vodafone ($160.17/month)', 36.96]
  ];
  var BUDGET_TAX = [['GST provision', 103.12], ['Income-tax provision', 123.29], ['Medicare provision', 20.62]];
  var BUDGET_PERSONAL = [
    ['Rent', 310], ['Food ($30/day)', 210], ['Utilities', 40], ['Claude Max ($199.99/month)', 46.15], ['Anytime Fitness', 25.95],
    ['Higgsfield (≈ $93.94/month)', 21.68], ['Microsoft 365 ($48.51/month)', 11.19], ['Apple One ($24.95/month)', 5.76]
  ];
  // Expense categories: [name, default business %, includes GST by default]
  var EXPENSE_CATS = [
    ['Charging', 80, true], ['Splend', 80, true], ['Car wash', 80, true], ['Vodafone', 50, true],
    ['Parking (on shift)', 100, true], ['Tolls (on shift)', 100, true], ['Car supplies', 80, true],
    ['Other business', 100, true], ['Food on shift', 0, true], ['Personal', 0, true]
  ];
  function catInfo(name) { for (var i = 0; i < EXPENSE_CATS.length; i++) if (EXPENSE_CATS[i][0] === name) return EXPENSE_CATS[i]; return [name, 100, true]; }

  /* ---------------- tax engine (illustrative resident rates, sole trader, no other income) ---------------- */
  function fyStartYear(dateStr) { var p = dateStr.split('-'); return +p[1] >= 7 ? +p[0] : +p[0] - 1; } // FY 2026-27 → 2026
  function fyLabel(y) { return y + '–' + String(y + 1).slice(2); }
  function quarterOf(dateStr) { var p = dateStr.split('-'), m = +p[1], y = +p[0]; var q = m >= 7 && m <= 9 ? 1 : m >= 10 ? 2 : m <= 3 ? 3 : 4; return { fy: fyStartYear(dateStr), q: q }; }
  var Q_NAMES = { 1: 'Jul–Sep', 2: 'Oct–Dec', 3: 'Jan–Mar', 4: 'Apr–Jun' };
  function qDue(fy, q) { return q === 1 ? '28 Oct ' + fy : q === 2 ? '28 Feb ' + (fy + 1) : q === 3 ? '28 Apr ' + (fy + 1) : '28 Jul ' + (fy + 1); }
  function qRange(fy, q) { var s = q === 1 ? [fy, 7] : q === 2 ? [fy, 10] : q === 3 ? [fy + 1, 1] : [fy + 1, 4]; var a = s[0] + '-' + pad(s[1]) + '-01'; var e = s[1] + 3 > 12 ? (s[0] + 1) + '-01-01' : s[0] + '-' + pad(s[1] + 3) + '-01'; return [a, e]; }
  function incomeTax(ti, fy) {
    var low = fy >= 2027 ? 0.14 : 0.15; if (fy < 2026) low = 0.16;
    var t = 0;
    if (ti > 18200) t += low * (Math.min(ti, 45000) - 18200);
    if (ti > 45000) t += 0.30 * (Math.min(ti, 135000) - 45000);
    if (ti > 135000) t += 0.37 * (Math.min(ti, 190000) - 135000);
    if (ti > 190000) t += 0.45 * (ti - 190000);
    var lito = ti <= 37500 ? 700 : ti <= 45000 ? 700 - 0.05 * (ti - 37500) : ti <= 66667 ? 325 - 0.015 * (ti - 45000) : 0;
    var ml = 27222, med = ti <= ml ? 0 : Math.min(0.02 * ti, 0.10 * (ti - ml)); // low-income reduction (2025–26 single threshold)
    return { gross: t, lito: Math.min(lito, t), net: Math.max(0, t - lito), medicare: med };
  }
  function shiftGross(s) { return s.grossFares != null && s.grossFares !== '' ? Number(s.grossFares) : null; }
  function shiftFees(s) { return s.uberFees != null && s.uberFees !== '' ? Number(s.uberFees) : 0; }
  // Totals for a date range [a, b): sales, GST, credits, deductions.
  function taxFigures(a, b) {
    var sh = state.shifts.filter(function (s) { return s.date >= a && s.date < b; });
    var ex = state.expenses.filter(function (e) { return e.date >= a && e.date < b; });
    var missing = 0, g1 = 0, fees = 0, net = 0;
    sh.forEach(function (s) { var g = shiftGross(s); net += Number(s.receipts) || 0; if (g == null) { missing++; g = Number(s.receipts) || 0; } g1 += g; fees += shiftFees(s); });
    var a1 = g1 / 11, creditsFees = fees / 11, creditsExp = 0, dedExp = 0, noReceipt = 0, bizSpend = 0;
    ex.forEach(function (e) {

      sb.from('days').select('*').limit(1000),

  function connect() {

    }
    sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true } });

    var form = document.getElementById('f-login'), err = document.getElementById('l-err');
    function creds() { return { email: document.getElementById('l-email').value.trim(), password: document.getElementById('l-pass').value }; }
    form.addEventListener('submit', function (e) {
      e.preventDefault(); err.textContent = '';

    else state[collection][rec.id] = rec;

      '<div class="btn-row"><button class="btn btn-secondary btn-small" data-act="trip" data-v="business">Business trip</button><button class="btn btn-secondary btn-small" data-act="trip" data-v="private">Private trip</button></div>' +
      '<span class="caption">ATO logbook: 12 continuous weeks covering every trip, with date, odometer start and end, km and purpose. Keep it for 5 years; it stays valid for 5 years.</span></section>';

    // Budget plan (Base Plan v1.5)
    var bizT = BUDGET_BIZ.reduce(function (s, b) { return s + b[1]; }, 0), taxT = BUDGET_TAX.reduce(function (s, b) { return s + b[1]; }, 0), perT = BUDGET_PERSONAL.reduce(function (s, b) { return s + b[1]; }, 0);
    function lines(arr) { return arr.map(function (b) { return kvRow(esc(b[0]), '−' + money(b[1], true)); }).join(''); }
    var budgetCard = '<section class="card"><div class="card-head"><h3 class="heading">Weekly budget plan</h3><span class="caption">Base Plan v1.5</span></div>' +
      '<div class="kv">' + kvRow('Receipts after fees (' + money(DAY_TARGET) + ' × 7)', money(WEEK_TARGET, true), 'total') +
      lines(BUDGET_BIZ) + lines(BUDGET_TAX) + kvRow('Available after business costs and tax', money(WEEK_TARGET - bizT - taxT, true), 'total') +
      lines(BUDGET_PERSONAL) + kvRow('Cash extra (unlisted costs and savings)', money(WEEK_TARGET - bizT - taxT - perT, true), 'total') + '</div>' +
      '<span class="caption">Break-even: ' + money(DAY_BREAKEVEN, true) + ' a day.</span></section>';

    return notice() + '<h2 class="page-title">Money</h2>' + taxCard + expCard + basCard + itCard + lbCard + budgetCard +
      '<section class="card"><div class="card-head"><h3 class="heading">Backup</h3><span class="caption">App version ' + APP_VERSION + '</span></div><p class="body" style="margin:0">Saves a copy of all your entries as a file. On iPhone, choose Save to Files and pick your Transition Year Plan folder in OneDrive, so Claude can read it.</p><button class="btn btn-secondary btn-small" data-act="export">Back up my data</button></section>' +
      (user ? '<button class="link-btn" data-act="signout" style="align-self:center">Sign out (' + esc(user.email) + ')</button>' : '');
  }

  /* ---------------- sheets (forms) ---------------- */
  var scrim = document.getElementById('sheet-scrim'), sheet = document.getElementById('sheet'), lastFocus = null;
  function openSheet(html) { lastFocus = document.activeElement; sheet.innerHTML = html; scrim.classList.add('open'); var f = sheet.querySelector('input,select,button'); if (f) f.focus(); }
  function closeSheet() { scrim.classList.remove('open'); sheet.innerHTML = ''; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  scrim.addEventListener('click', function (e) { if (e.target === scrim) closeSheet(); });
  sheet.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  function shiftSheet() {
    var d = now(), lastOdo = state.logbook.reduce(function (m, l) { return Math.max(m, l.odoEnd || 0); }, 0);
    openSheet('<h2 class="title" id="sheet-title">Log shift</h2>' +
      '<form id="f-shift" style="display:flex;flex-direction:column;gap:14px" novalidate>' +
      '<div class="field"><label for="s-date">Date</label><input id="s-date" type="date" value="' + ymd(d) + '" required></div>' +
      '<div class="field"><label for="s-nh">Normal-rate driving</label><div class="two"><input id="s-nh" type="number" inputmode="numeric" min="0" max="16" value="5" aria-label="Hours"><input id="s-nm" type="number" inputmode="numeric" min="0" max="59" step="5" value="50" aria-label="Minutes"></div><span class="hint">Hours and minutes online, not counting the homeward hour. Plan: 5 h 50.</span></div>' +
      '<div class="field"><label for="s-hm">Homeward driving (minutes)</label><input id="s-hm" type="number" inputmode="numeric" min="0" max="180" step="5" value="60"></div>' +
      '<div class="two"><div class="field"><label for="s-g">Gross fares ($)</label><input id="s-g" type="number" inputmode="decimal" min="0" step="0.01" placeholder="incl. GST"></div>' +
      '<div class="field"><label for="s-f">Uber fees ($)</label><input id="s-f" type="number" inputmode="decimal" min="0" step="0.01" placeholder="service fee"></div></div>' +
      '<div class="field"><label for="s-r">Earnings after fees ($)</label><input id="s-r" type="number" inputmode="decimal" min="0" step="0.01" placeholder="e.g. 250.00" required><span class="hint">Fills in from gross fares minus fees. Gross fares and fees are needed for the BAS — they are in the Uber app under the trip or weekly statement.</span></div>' +
      '<div class="two"><div class="field"><label for="s-o1">Odometer start</label><input id="s-o1" type="number" inputmode="numeric" min="0" step="1"' + (lastOdo ? ' placeholder="last ' + lastOdo + '"' : '') + '></div>' +
      '<div class="field"><label for="s-o2">Odometer end</label><input id="s-o2" type="number" inputmode="numeric" min="0" step="1"></div></div>' +
      '<span class="hint" style="margin-top:-8px">Odometer readings add a business entry to the logbook and fill in the kilometres.</span>' +
      '<div class="field"><label for="s-n">Note</label><input id="s-n" type="text" maxlength="80"></div>' +
      '<p class="caption" id="s-err" role="alert" style="margin:0;color:var(--money-label)"></p>' +
      '<div class="btn-row"><button type="button" class="btn btn-secondary" data-act="close">Cancel</button><button type="submit" class="btn btn-primary">Save shift</button></div></form>');
    var gEl = document.getElementById('s-g'), fEl = document.getElementById('s-f'), rEl = document.getElementById('s-r');
    function autoNet() { var g = parseFloat(gEl.value), f = parseFloat(fEl.value); if (g >= 0 && f >= 0) rEl.value = (Math.round((g - f) * 100) / 100).toFixed(2); }
    gEl.addEventListener('input', autoNet); fEl.addEventListener('input', autoNet);
    document.getElementById('f-shift').addEventListener('submit', function (e) {
      e.preventDefault();
      var err = document.getElementById('s-err');
      var r = parseFloat(rEl.value), date = document.getElementById('s-date').value;
      var g = gEl.value === '' ? null : parseFloat(gEl.value), f = fEl.value === '' ? null : parseFloat(fEl.value);
      var o1 = parseInt(document.getElementById('s-o1').value, 10), o2 = parseInt(document.getElementById('s-o2').value, 10);
      var nmin = (parseInt(document.getElementById('s-nh').value, 10) || 0) * 60 + (parseInt(document.getElementById('s-nm').value, 10) || 0);
      if (!date) { err.textContent = 'Pick a date.'; return; }
      if (!(r >= 0)) { err.textContent = 'Enter the earnings after fees, e.g. 250.'; return; }
      if ((o1 >= 0) !== (o2 >= 0) || (o1 >= 0 && o2 < o1)) { err.textContent = 'Enter both odometer readings, with the end higher than the start.'; return; }
      var hasOdo = o1 >= 0 && o2 >= o1;
      var data = { date: date, normalMin: nmin, homeMin: parseInt(document.getElementById('s-hm').value, 10) || 0, receipts: Math.round(r * 100) / 100,
        grossFares: g == null || isNaN(g) ? null : Math.round(g * 100) / 100, uberFees: f == null || isNaN(f) ? null : Math.round(f * 100) / 100,
        km: hasOdo ? o2 - o1 : 0, note: document.getElementById('s-n').value.trim(), createdAt: new Date().toISOString() };
      save('shifts', null, data).then(function () {
        if (hasOdo && (state.dbV2 || !sb)) return save('logbook', null, { date: date, odoStart: o1, odoEnd: o2, kind: 'business', purpose: 'Uber shift' });
      }).then(function () { closeSheet(); toast('Shift saved'); });
    });
  }

  function expenseSheet() {
    var d = now();
    openSheet('<h2 class="title" id="sheet-title">Log expense</h2>' +
      '<form id="f-exp" style="display:flex;flex-direction:column;gap:14px" novalidate>' +
      '<div class="field"><label for="e-date">Date</label><input id="e-date" type="date" value="' + ymd(d) + '" required></div>' +
      '<div class="field"><label for="e-cat">What for</label><select id="e-cat">' + EXPENSE_CATS.map(function (c) { return '<option>' + esc(c[0]) + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label for="e-amt">Amount paid ($, incl. GST)</label><input id="e-amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="e.g. 35.00" required></div>' +
      '<div class="two"><div class="field"><label for="e-pct">Business share (%)</label><input id="e-pct" type="number" inputmode="numeric" min="0" max="100" step="5" value="80"></div>' +
      '<div class="field"><label for="e-gst">GST included ($)</label><input id="e-gst" type="number" inputmode="decimal" min="0" step="0.01"></div></div>' +
      '<span class="hint" id="e-calc" style="margin-top:-8px"></span>' +
      '<label class="chip" style="display:flex;align-items:center;gap:10px;justify-content:flex-start"><input id="e-rec" type="checkbox" style="width:20px;height:20px"> Tax invoice / receipt kept</label>' +
      '<div class="field"><label for="e-n">Note</label><input id="e-n" type="text" maxlength="80" placeholder="e.g. Evie charger, Rhodes"></div>' +
      '<p class="caption" id="e-err" role="alert" style="margin:0;color:var(--money-label)"></p>' +
      '<div class="btn-row"><button type="button" class="btn btn-secondary" data-act="close">Cancel</button><button type="submit" class="btn btn-primary">Save expense</button></div></form>');
    var cat = document.getElementById('e-cat'), amt = document.getElementById('e-amt'), pct = document.getElementById('e-pct'), gst = document.getElementById('e-gst'), calc = document.getElementById('e-calc');
    var gstTouched = false;
    function update() {
      var info = catInfo(cat.value), a = parseFloat(amt.value) || 0;
      if (!gstTouched) gst.value = info[2] && a > 0 ? (Math.round(a / 11 * 100) / 100).toFixed(2) : '';
      var p = Math.max(0, Math.min(100, parseFloat(pct.value) || 0)) / 100, g = parseFloat(gst.value) || 0;
      calc.textContent = a > 0 ? (p > 0 ? 'GST credit ' + money(g * p, true) + ' · tax deduction ' + money((a - g) * p, true) : 'Personal — not claimed.') : '';
    }
    cat.addEventListener('change', function () { pct.value = catInfo(cat.value)[1]; update(); });
    amt.addEventListener('input', update); pct.addEventListener('input', update);
    gst.addEventListener('input', function () { gstTouched = true; update(); });
    document.getElementById('f-exp').addEventListener('submit', function (e) {
      e.preventDefault();
      var a = parseFloat(amt.value), date = document.getElementById('e-date').value, p = parseInt(pct.value, 10), g = parseFloat(gst.value) || 0;
      if (!date || !(a > 0)) { document.getElementById('e-err').textContent = 'Enter a date and an amount above $0.'; return; }
      if (!(p >= 0 && p <= 100)) { document.getElementById('e-err').textContent = 'Business share must be between 0 and 100.'; return; }
      if (g > a / 11 + 0.01) { document.getElementById('e-err').textContent = 'GST can be at most 1/11 of the amount (' + money(a / 11, true) + ').'; return; }
      save('expenses', null, { date: date, category: cat.value, amount: Math.round(a * 100) / 100, businessPct: p, gst: Math.round(g * 100) / 100,
        receiptKept: document.getElementById('e-rec').checked, note: document.getElementById('e-n').value.trim(), createdAt: new Date().toISOString() })
        .then(function () { closeSheet(); toast('Expense saved'); });
    });
  }

  function tripSheet(kind) {
    var d = now(), lastOdo = state.logbook.reduce(function (m, l) { return Math.max(m, l.odoEnd || 0); }, 0);
    openSheet('<h2 class="title" id="sheet-title">' + (kind === 'private' ? 'Private trip' : 'Business trip') + '</h2>' +
      '<form id="f-trip" style="display:flex;flex-direction:column;gap:14px" novalidate>' +
      '<div class="field"><label for="tr-date">Date</label><input id="tr-date" type="date" value="' + ymd(d) + '" required></div>' +
      '<div class="two"><div class="field"><label for="tr-o1">Odometer start</label><input id="tr-o1" type="number" inputmode="numeric" min="0" step="1" value="' + (lastOdo || '') + '"></div>' +
      '<div class="field"><label for="tr-o2">Odometer end</label><input id="tr-o2" type="number" inputmode="numeric" min="0" step="1"></div></div>' +
      '<div class="field"><label for="tr-p">Purpose</label><input id="tr-p" type="text" maxlength="80" placeholder="' + (kind === 'private' ? 'e.g. groceries, family visit' : 'e.g. Uber shift, car wash, charging') + '"></div>' +
      '<p class="caption" id="tr-err" role="alert" style="margin:0;color:var(--money-label)"></p>' +
      '<div class="btn-row"><button type="button" class="btn btn-secondary" data-act="close">Cancel</button><button type="submit" class="btn btn-primary">Save trip</button></div></form>');
    document.getElementById('f-trip').addEventListener('submit', function (e) {
      e.preventDefault();
      var date = document.getElementById('tr-date').value, o1 = parseInt(document.getElementById('tr-o1').value, 10), o2 = parseInt(document.getElementById('tr-o2').value, 10);
      if (!date || !(o1 >= 0) || !(o2 > o1)) { document.getElementById('tr-err').textContent = 'Enter a date and both odometer readings, with the end higher than the start.'; return; }
      if (sb && !state.dbV2) { document.getElementById('tr-err').textContent = 'Run the one-off database update first (update-v0.3.sql).'; return; }
      save('logbook', null, { date: date, odoStart: o1, odoEnd: o2, kind: kind, purpose: document.getElementById('tr-p').value.trim() || (kind === 'private' ? 'Private' : 'Business') })
        .then(function () { closeSheet(); toast('Trip saved'); });
    });
  }

  function taxSheet() {
    var ws = weekStart(now()), key = 'w' + ymd(ws), cur = Number((state.tax[key] || {}).amount) || 0, wr = weekReserve(ws);
    var goal = wr.days ? Math.round(wr.target * 100) / 100 : TAX_WEEKLY;
    openSheet('<h2 class="title" id="sheet-title">Tax account</h2><p class="body" style="margin:0">How much have you moved to the tax account for the week starting Sunday ' + ws.getDate() + ' ' + MONTHS[ws.getMonth()] + '? ' +
      (wr.days ? 'Based on ' + money(wr.receipts, true) + ' earned over ' + wr.days + ' day' + (wr.days === 1 ? '' : 's') + ', set aside ' + money(goal, true) + '.' : 'The plan figure for a full week is ' + money(TAX_WEEKLY, true) + '.') + '</p>' +
      '<form id="f-tax" style="display:flex;flex-direction:column;gap:14px" novalidate><div class="field"><label for="t-amt">Total set aside this week ($)</label><input id="t-amt" type="number" inputmode="decimal" min="0" step="0.01" value="' + (cur || goal) + '"></div>' +
      '<div class="btn-row"><button type="button" class="btn btn-secondary" data-act="close">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div></form>');
    document.getElementById('f-tax').addEventListener('submit', function (e) {
      e.preventDefault(); var a = parseFloat(document.getElementById('t-amt').value) || 0;
      save('tax', key, { amount: Math.round(a * 100) / 100, updatedAt: new Date().toISOString() }).then(function () { closeSheet(); toast('Tax account updated'); });
    });
  }

  function exportData() {
    var stamp = ymd(now());
    var pack = function (tables) {
      var payload = { app: 'Field Notes', version: 1, exportedAt: new Date().toISOString(), account: user ? user.email : null, tables: tables };
      var json = JSON.stringify(payload, null, 2);
      var name = 'field-notes-backup-' + stamp + '.json';
      var file = null;
      try { file = new File([json], name, { type: 'application/json' }); } catch (x) {}
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: name }).catch(function () {});
        return;
      }
      var url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
      toast('Backup saved: ' + name);
    };
    if (sb && user) {
      Promise.all(['shifts', 'expenses', 'days', 'tax_weeks', 'logbook'].map(function (t) { return sb.from(t).select('*').limit(5000); })).then(function (res) {
        if (res.slice(0, 4).some(function (r) { return r.error; })) { toast('Could not read your data for the backup'); return; }
        pack({ shifts: res[0].data, expenses: res[1].data, days: res[2].data, tax_weeks: res[3].data, logbook: res[4].error ? [] : res[4].data });
      });
    } else {
      pack({ shifts: state.shifts, expenses: state.expenses, days: state.days, tax_weeks: state.tax, logbook: state.logbook });
    }
  }

  /* ---------------- actions ---------------- */
  var busy = {};
  function setDay(key, patch) {
    if (busy[key]) return; busy[key] = true;
    var doc = Object.assign({}, dayDoc(key), patch); delete doc.id; doc.updatedAt = new Date().toISOString();
    save('days', key, doc).then(function () { busy[key] = false; }, function () { busy[key] = false; });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act'), key = ymd(now());
    if (act === 'shift') shiftSheet();
    else if (act === 'expense') expenseSheet();
    else if (act === 'tax') taxSheet();
    else if (act === 'trip') tripSheet(b.getAttribute('data-v'));
    else if (act === 'close') closeSheet();
    else if (act === 'export') exportData();
    else if (act === 'signout') { if (sb) sb.auth.signOut(); }
    else if (act === 'ex') { var v = b.getAttribute('data-v'); setDay(key, { exercise: v || null }); toast(v ? (v === 'gym' ? 'Gym logged' : 'Walk logged') : 'Exercise cleared'); }
    else if (act === 'study') { var add = parseInt(b.getAttribute('data-v'), 10); var m = Math.max(0, (Number(dayDoc(key).studyMin) || 0) + add); setDay(key, { studyMin: m }); toast('Study today: ' + hm(m)); }
    else if (act === 'del') { remove(b.getAttribute('data-c'), b.getAttribute('data-id')).then(function () { toast('Deleted'); }); }
    else if (act === 'tab') { state.tab = b.getAttribute('data-v'); try { location.hash = state.tab === 'today' ? '' : state.tab; } catch (x) {} render(); window.scrollTo(0, 0); }
  });

  var toastTimer;
  function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800); }

  /* ---------------- render ---------------- */
  var TABS = [['today', 'Today', 'home'], ['work', 'Work', 'car'], ['study', 'Study', 'book'], ['health', 'Health', 'heart'], ['money', 'Money', 'wallet']];
  function render() {
    var d = now(), h = d.getHours();
    document.getElementById('hdr-date').textContent = longDate(d) + ' · ' + clockAp(nowMin(d));
    document.getElementById('hdr-greeting').textContent = (h < 12 ? 'Morning' : h < 17 ? 'Afternoon' : 'Evening') + ', Istvan';
    document.getElementById('nav').innerHTML = TABS.map(function (t) {
      return '<button type="button" data-act="tab" data-v="' + t[0] + '"' + (state.tab === t[0] ? ' aria-current="page"' : '') + '>' + icon(t[2]) + t[1] + '</button>';
    }).join('');
    var v = state.tab;
    document.getElementById('view').innerHTML = v === 'work' ? viewWork(d) : v === 'study' ? viewStudy(d) : v === 'health' ? viewHealth(d) : v === 'money' ? viewMoney(d) : viewToday(d);
  }

  var h0 = (location.hash || '').replace('#', '');
  if (['work', 'study', 'health', 'money'].indexOf(h0) >= 0) state.tab = h0;
  window.addEventListener('hashchange', function () { var h = (location.hash || '').replace('#', ''); state.tab = ['work', 'study', 'health', 'money'].indexOf(h) >= 0 ? h : 'today'; render(); });
  function checkUpdate() {
    if (location.protocol.indexOf('http') !== 0) return;
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (v) {
      if (!v || !v.version || v.version === APP_VERSION) return;
      var key = 'fn-updated-' + v.version;
      try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch (x) {}
      fetch('./', { cache: 'reload' }).catch(function () {}).then(function () {
        fetch('config.js', { cache: 'reload' }).catch(function () {}).then(function () { location.reload(); });
      });
    }).catch(function () {});
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') checkUpdate(); });
  render();
  connect();
  checkUpdate();
  setInterval(function () { if (!scrim.classList.contains('open')) render(); }, 30000);
})();
</script>
</body>
</html>
