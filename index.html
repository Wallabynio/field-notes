<script>
  /* Theme: Auto follows the iPhone's Light/Dark setting; Light or Dark can be fixed in the app. Set before first paint. */
  (function () {
    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    function apply() {
      var m = 'auto'; try { m = localStorage.getItem('fn-theme') || 'auto'; } catch (x) {}
      var t = m === 'auto' ? (mq && !mq.matches ? 'light' : 'dark') : m;
      document.documentElement.setAttribute('data-theme', t);
      var sk = 'ledger'; try { sk = localStorage.getItem('fn-skin') || 'ledger'; } catch (x) {}
      document.documentElement.setAttribute('data-skin', sk);
      var meta = document.getElementById('meta-theme'); if (meta) meta.setAttribute('content', t === 'light' ? '#F6F2EA' : '#111214');
    }
    window.fnApplyTheme = function (fade) { var h = document.documentElement; if (fade) { h.classList.add('theme-anim'); setTimeout(function () { h.classList.remove('theme-anim'); }, 700); } apply(); };
    apply();
    if (mq) { var on = function () { window.fnApplyTheme(true); };
      if (mq.addEventListener) mq.addEventListener('change', on); else if (mq.addListener) mq.addListener(on); }
  })();
</script>

<style>
/* Field Notes — design system v2 "Night Ledger": dark luxury.
   Charcoal ground, graphite surfaces, champagne-gold hairlines, jewel tones per life area.
   Playfair Display for display and headline figures; Inter for everything else (tabular figures). */
:root {
  --ground:#111214; --surface:#1B1C1F; --raised:#232428; --sunken:#0C0D0F;
  --ink:#ECE6DA; --ink-muted:#A39E93; --ink-faint:#6F6B64; --on-ink:#111214;
  --gold:#C9A96E; --gold-bright:#E3C68D; --gold-deep:#8C7346; --gold-soft:rgba(201,169,110,.10);
  --line:rgba(236,230,218,.08); --hair:rgba(201,169,110,.22);
  --work:#6F93CF; --work-soft:rgba(111,147,207,.12); --work-label:#9DB8E3; --work-track:rgba(111,147,207,.18);
  --study:#A487D1; --study-soft:rgba(164,135,209,.12); --study-label:#C6B2E8; --study-track:rgba(164,135,209,.18);
  --health:#5DB08C; --health-soft:rgba(93,176,140,.12); --health-label:#8FD0B2; --health-track:rgba(93,176,140,.18);
  --money:#C9A96E; --money-soft:rgba(201,169,110,.12); --money-label:#E3C68D; --money-track:rgba(201,169,110,.18);
  --rest:#8E887D; --rest-soft:rgba(142,136,125,.12); --rest-label:#B9B3A7; --rest-track:rgba(142,136,125,.18);
  --scrim: rgba(5,5,6,.72);
  --ground-rgb: 17,18,20; --nav-bg: rgba(22,23,26,.82); --neutral-fill: #3A3832; --shadow: none; --on-gold: #1A1610;
  --hero-fallback: linear-gradient(160deg, #23211d, #121315 70%); --thumb-fallback: linear-gradient(160deg,#2a2722,#17181b); --hero-photo: .78;
  --font-display: "Playfair Display", "Times New Roman", serif;
  --font-sans: Inter, system-ui, -apple-system, sans-serif;
  --ease: cubic-bezier(.2,.7,.2,1);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
button, input, select, textarea { font: inherit; color: inherit; }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; background: var(--ground); }
main { flex: 1; padding: 0 18px 128px; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { margin: 0; text-wrap: balance; font-weight: 500; }

/* hero (every tab): photo with a deep gradient, serif title */
.hero { position: relative; margin: 0 -18px 6px; min-height: calc(230px + env(safe-area-inset-top)); display: flex; flex-direction: column; justify-content: flex-end; padding: calc(24px + env(safe-area-inset-top)) 24px 22px; overflow: hidden; isolation: isolate; }
.hero.tall { min-height: calc(330px + env(safe-area-inset-top)); }
.hero-img { position: absolute; inset: 0; z-index: -2; background: radial-gradient(120% 90% at 85% 10%, rgba(201,169,110,.28), transparent 55%), radial-gradient(90% 80% at 0% 100%, rgba(111,147,207,.18), transparent 60%), var(--hero-fallback); background-size: cover; background-position: center; }
.hero-img img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity 1.2s var(--ease); }
.hero-img img.loaded { opacity: var(--hero-photo); }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--hero-fade, linear-gradient(180deg, rgba(var(--ground-rgb),.15) 0%, rgba(var(--ground-rgb),.35) 45%, var(--ground) 100%)); }
.hero-date { font-size: 13px; font-weight: 500; color: var(--gold-bright); letter-spacing: .02em; }
.hero-title { font-family: var(--font-display); font-size: 38px; line-height: 42px; font-weight: 500; letter-spacing: -.01em; margin-top: 4px; }
.hero-sub { font-size: 14px; color: var(--ink-muted); margin-top: 6px; max-width: 34ch; }
.page-title { font-family: var(--font-display); font-size: 34px; line-height: 40px; font-weight: 500; }

/* text */
.eyebrow { font-size: 13px; line-height: 18px; font-weight: 500; letter-spacing: .01em; color: var(--ink-muted); }
.heading { font-family: var(--font-display); font-size: 20px; line-height: 26px; font-weight: 500; }
.title { font-family: var(--font-display); font-size: 26px; line-height: 32px; font-weight: 500; }
.body { font-size: 14px; line-height: 21px; color: var(--ink-muted); }
.caption { font-size: 12.5px; line-height: 18px; font-weight: 400; color: var(--ink-muted); }
.fig, .fig-sm, .fig-lg { font-family: var(--font-sans); font-variant-numeric: tabular-nums lining-nums; }
.fig { font-size: 17px; line-height: 22px; font-weight: 600; }
.fig-sm { font-size: 14px; line-height: 20px; font-weight: 500; }
.fig-lg { font-family: var(--font-display); font-size: 34px; line-height: 40px; font-weight: 500; font-variant-numeric: lining-nums; }
.l-work { color: var(--work-label); } .l-study { color: var(--study-label); } .l-health { color: var(--health-label); } .l-money { color: var(--money-label); } .l-rest { color: var(--rest-label); }

/* cards: graphite, gold hairline; tinted cards get a jewel wash in one corner */
.card { position: relative; background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.a-work, .a-study, .a-health, .a-money, .a-rest { border-color: var(--hair); background-image: radial-gradient(140% 120% at 100% 0%, var(--wash), transparent 60%); }
.a-work { --wash: rgba(111,147,207,.16); } .a-study { --wash: rgba(164,135,209,.16); } .a-health { --wash: rgba(93,176,140,.16); } .a-money { --wash: rgba(201,169,110,.16); } .a-rest { --wash: rgba(142,136,125,.14); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

/* rings */
.ringstack { display: flex; gap: 20px; align-items: center; }
.ringstack svg { flex-shrink: 0; display: block; overflow: visible; }
.legend { display: flex; flex-direction: column; gap: 14px; flex: 1; min-width: 0; }
.figure { display: flex; flex-direction: column; gap: 2px; }
.arc { stroke-linecap: round; transition: stroke-dashoffset .6s var(--ease); }
.glow .arc { filter: drop-shadow(0 0 6px var(--glow, rgba(201,169,110,.45))); }
.ring-c { fill: var(--ink); font-family: var(--font-display); font-weight: 500; }
.ring-s { fill: var(--ink-muted); font-family: var(--font-sans); font-weight: 400; }
.intro .arc { animation: draw 1.6s var(--ease) both; }
.intro .arc:nth-of-type(2n) { animation-delay: .15s; } .intro .arc:nth-of-type(3n) { animation-delay: .3s; }
@keyframes draw { from { stroke-dashoffset: var(--circ); } }

/* bars */
.bar { display: flex; flex-direction: column; gap: 8px; }
.bar-head { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; line-height: 20px; font-weight: 500; }
.track { height: 6px; border-radius: 999px; overflow: hidden; background: var(--raised); }
.bar.lg .track { height: 8px; }
.fill { height: 100%; border-radius: 999px; transition: width .6s var(--ease); }
.t-work, .t-study, .t-health, .t-money, .t-rest { background: var(--raised); }
.on-soft.t-work { background: var(--work-track); } .on-soft.t-study { background: var(--study-track); } .on-soft.t-health { background: var(--health-track); } .on-soft.t-money { background: var(--money-track); } .on-soft.t-rest { background: var(--rest-track); }
.f-work { background: linear-gradient(90deg, #4E6FA6, var(--work)); } .f-study { background: linear-gradient(90deg, #7C62A8, var(--study)); } .f-health { background: linear-gradient(90deg, #3F8466, var(--health)); }
.f-money { background: linear-gradient(90deg, var(--gold-deep), var(--gold-bright)); } .f-rest { background: var(--rest); } .f-neutral { background: var(--neutral-fill); } .f-commute { background: #3F5578; }
.intro .fill { animation: grow 1.2s var(--ease) both; } @keyframes grow { from { width: 0; } }
.segs { display: grid; gap: 4px; }
.seg { height: 6px; border-radius: 999px; }

/* timeline */
.tl-wrap { position: relative; }
.tl { display: flex; height: 18px; border-radius: 999px; overflow: hidden; gap: 2px; }
.tl-now { position: absolute; top: -5px; width: 2px; height: 28px; margin-left: -1px; background: var(--gold-bright); border-radius: 2px; box-shadow: 0 0 10px rgba(227,198,141,.8); }
.tl-ends { display: flex; justify-content: space-between; }
.legend-row { display: flex; gap: 14px; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 999px; display: inline-block; vertical-align: 1px; margin-right: 6px; }

/* buttons */
.btn { min-height: 52px; padding: 0 22px; border: 1px solid transparent; border-radius: 999px; font-size: 15px; font-weight: 600; letter-spacing: .01em; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: transform .15s var(--ease), background .2s; }
.btn:active { transform: scale(.97); }
.btn-primary { background: linear-gradient(180deg, var(--gold-bright), var(--gold)); color: var(--on-gold); box-shadow: 0 6px 24px -10px rgba(201,169,110,.7); }
.btn-secondary { background: transparent; color: var(--ink); border-color: var(--hair); }
.btn-small { min-height: 44px; padding: 0 18px; font-size: 14px; }
.btn-row { display: flex; gap: 10px; } .btn-row .btn { flex: 1; }
.btn:focus-visible, .nav button:focus-visible, .chip:focus-visible, .link-btn:focus-visible, .row-btn:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }
.chip { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--hair); background: transparent; color: var(--ink); font-weight: 500; font-size: 14px; cursor: pointer; transition: background .2s, color .2s; }
.chip[aria-pressed="true"] { background: var(--gold); color: var(--on-gold); border-color: var(--gold); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.link-btn { background: none; border: none; color: var(--ink-faint); font-weight: 500; font-size: 13px; cursor: pointer; min-height: 44px; padding: 0 4px; }

/* lists */
.list { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: none; }
.row-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.row-title { font-size: 15px; font-weight: 500; }
.row-sub { font-size: 13px; color: var(--ink-muted); overflow-wrap: anywhere; }
.row-btn { all: unset; cursor: pointer; display: grid; grid-template-columns: 64px minmax(0,1fr) auto; gap: 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.row-btn:first-child { border-top: none; }
.thumb { width: 64px; height: 64px; border-radius: 14px; background: var(--raised) center/cover no-repeat; border: 1px solid var(--line); }
.chev { color: var(--gold); }
.empty { font-size: 14px; color: var(--ink-muted); padding: 6px 0; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 14px; font-size: 14px; }
.kv .fig-sm { text-align: right; }
.kv .total { font-weight: 600; border-top: 1px solid var(--hair); padding-top: 8px; color: var(--ink); }

/* day agenda */
.agenda { display: flex; flex-direction: column; gap: 2px; }
.ag-row { display: grid; grid-template-columns: 50px 3px minmax(0, 1fr) auto; gap: 14px; align-items: stretch; padding: 10px 12px; border-radius: 16px; }
.ag-row.now { background: var(--gold-soft); box-shadow: inset 0 0 0 1px var(--hair); }
.ag-time { font-size: 13px; line-height: 20px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--ink-muted); }
.ag-pill { border-radius: 999px; min-height: 36px; }
.ag-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ag-title { font-size: 15px; line-height: 20px; font-weight: 500; }
.ag-sub { font-size: 12.5px; line-height: 18px; color: var(--ink-muted); }
.ag-state { align-self: center; font-size: 12px; color: var(--ink-faint); white-space: nowrap; }
.ag-row.past .ag-title, .ag-row.past .ag-time { color: var(--ink-faint); }
.ag-row.past .ag-pill { opacity: .35; }
.ag-badge { font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 3px 9px; border-radius: 999px; background: var(--gold); color: var(--on-gold); }

/* nav: frosted bar, gold indicator */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; }
.nav-inner { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--nav-bg); -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%); border-top: 1px solid var(--hair); padding: 8px 4px calc(12px + env(safe-area-inset-bottom)); }
.nav button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: var(--ink-faint); font-size: 11px; font-weight: 500; letter-spacing: .02em; min-height: 52px; padding-top: 8px; cursor: pointer; transition: color .2s; }
.nav button[aria-current="page"] { color: var(--gold-bright); }
.nav button[aria-current="page"]::before { content: ""; position: absolute; top: -9px; width: 28px; height: 2px; border-radius: 2px; background: var(--gold-bright); box-shadow: 0 0 10px rgba(227,198,141,.8); }

/* sheet */
.sheet-scrim { position: fixed; inset: 0; background: var(--scrim); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); z-index: 10; display: none; align-items: flex-end; justify-content: center; }
.sheet-scrim.open { display: flex; animation: fade .25s var(--ease); }
.sheet { width: 100%; max-width: 480px; max-height: 92%; overflow-y: auto; background: var(--surface); border: 1px solid var(--hair); border-bottom: none; border-radius: 28px 28px 0 0; padding: 26px 22px calc(26px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 16px; }
.sheet-scrim.open .sheet { animation: rise .35s var(--ease); }
.sheet-photo { margin: -26px -22px 0; height: 200px; border-radius: 28px 28px 0 0; background: var(--raised) center/cover no-repeat; position: relative; }
.sheet-photo::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(180deg, transparent 40%, var(--surface)); }
@keyframes rise { from { transform: translateY(40px); opacity: 0; } } @keyframes fade { from { opacity: 0; } }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 500; color: var(--ink-muted); }
.field input, .field select { min-height: 50px; border-radius: 14px; border: 1px solid var(--line); background: var(--sunken); padding: 0 14px; font-size: 16px; color: var(--ink); }
.field input:focus, .field select:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,169,110,.18); }
.field .hint { font-size: 12.5px; color: var(--ink-faint); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.notice { font-size: 13.5px; color: var(--gold-bright); background: var(--gold-soft); border: 1px solid var(--hair); border-radius: 16px; padding: 12px 14px; }
.toast { position: fixed; left: 50%; bottom: 112px; transform: translate(-50%, 10px); background: var(--raised); color: var(--ink); border: 1px solid var(--hair); padding: 10px 18px; border-radius: 999px; font-weight: 500; font-size: 14px; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s var(--ease); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.login { padding: 24px 20px 60px; display: flex; flex-direction: column; gap: 16px; }
.login[hidden], .app-main[hidden] { display: none; }

/* recipe */
.steps { margin: 0; padding: 0; list-style: none; counter-reset: step; display: flex; flex-direction: column; gap: 12px; }
.steps li { counter-increment: step; display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 12px; font-size: 15px; line-height: 22px; }
.steps li::before { content: counter(step); font-family: var(--font-display); color: var(--gold); font-size: 18px; line-height: 22px; }
.ingr { display: grid; grid-template-columns: 76px minmax(0,1fr); gap: 8px 12px; font-size: 15px; }
.ingr .q { text-align: right; color: var(--gold-bright); font-variant-numeric: tabular-nums; }
.check { display: grid; grid-template-columns: 24px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); cursor: pointer; }
.check:first-child { border-top: none; }
.check input { width: 20px; height: 20px; accent-color: var(--gold); }
.check.done .row-title { color: var(--ink-faint); text-decoration: line-through; }
.grade { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .06em; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-muted); }
.grade.hd { color: var(--gold-bright); border-color: var(--hair); background: var(--gold-soft); }
.as-row { grid-template-columns: 40px minmax(0,1fr) auto; }
.as-icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; border: 1px solid var(--line); color: var(--ink-muted); }
.as-icon.done { color: var(--on-gold); background: var(--gold); border-color: var(--gold); }
.timeline { display: flex; flex-direction: column; position: relative; }
.tl-year { font-family: var(--font-display); font-size: 17px; color: var(--gold-bright); padding: 14px 0 4px; }
.tl-year:first-child { padding-top: 0; }
.tl-row { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 14px minmax(0,1fr) auto; gap: 12px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
button.tl-row { cursor: pointer; }
.tl-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gold); margin-top: 6px; }
.tl-row.future .tl-dot { background: transparent; border: 1px solid var(--ink-faint); }
.tl-row.future .row-title, .tl-row.future .row-sub { color: var(--ink-faint); }
.tl-row.now .tl-dot { background: var(--study, #A487D1); box-shadow: 0 0 0 4px rgba(164,135,209,.22); }
.tl-row.now .row-title { color: var(--ink); }
.tl-mark { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.check .row-main .eyebrow { font-size: 12px; }
.tabs { display: flex; gap: 6px; padding: 4px; background: var(--sunken); border-radius: 999px; border: 1px solid var(--line); }
.tabs button { flex: 1; min-height: 40px; border: none; border-radius: 999px; background: none; color: var(--ink-muted); font-weight: 500; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--raised); color: var(--gold-bright); box-shadow: inset 0 0 0 1px var(--hair); }


/* day-plan icons */
.ag-row { grid-template-columns: 50px 30px minmax(0, 1fr) auto; }
.ag-ico { width: 30px; height: 30px; border-radius: 999px; display: grid; place-items: center; background: var(--raised); color: var(--ink-muted); border: 1px solid var(--line); align-self: start; }
.i-work { color: var(--work-label); background: var(--work-soft); } .i-study { color: var(--study-label); background: var(--study-soft); }
.i-health { color: var(--health-label); background: var(--health-soft); } .i-money { color: var(--gold-bright); background: var(--money-soft); }
.i-commute { color: var(--work-label); background: var(--work-soft); } .i-rest { color: var(--rest-label); background: var(--rest-soft); }
.ag-row.past .ag-ico { opacity: .45; }
.ag-row.now .ag-ico { border-color: var(--gold); box-shadow: 0 0 12px rgba(201,169,110,.35); }

/* illustrations: hairline gold drawings */
.illo { display: block; width: 120px; height: 80px; fill: none; stroke: var(--gold); stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; opacity: .75; }
.illo .hot { stroke: var(--gold-bright); stroke-width: 1.3; filter: drop-shadow(0 0 4px rgba(227,198,141,.6)); }
.has-illo { overflow: hidden; }
.has-illo > *:not(.illo) { position: relative; z-index: 1; }

  function bodySheet() {
    var d = now(), key = ymd(d), cur = state.body[key] || {};
    openSheet('<h2 class="title" id="sheet-title">Weigh-in</h2><p class="body" style="margin:0">Sunday mornings, before breakfast, same scales. Waist on the first Sunday of the month, at navel level.</p>' +

      '<div class="field"><label for="b-waist">Waist (cm)</label><input id="b-waist" type="number" inputmode="decimal" min="50" max="200" step="0.5" value="' + (cur.waist || '') + '"></div></div>' +
      '<div class="two"><div class="field"><label for="b-sys">BP top number</label><input id="b-sys" type="number" inputmode="numeric" min="70" max="250" value="' + (cur.bpSys || '') + '"></div>' +
      '<div class="field"><label for="b-dia">BP bottom number</label><input id="b-dia" type="number" inputmode="numeric" min="40" max="150" value="' + (cur.bpDia || '') + '"></div></div>' +

    document.getElementById('f-body').addEventListener('submit', function (e) {

      function v(id) { var x = parseFloat(document.getElementById(id).value); return isFinite(x) && x > 0 ? x : null; }

      if (!date || (data.weight == null && data.waist == null && data.bpSys == null)) { document.getElementById('b-err').textContent = 'Enter a date and at least one measurement.'; return; }

  function setAsideBetween(a, b) {
    return Object.keys(state.tax).reduce(function (t, k) { var w = k.slice(1); return w >= a && w < b ? t + (Number(state.tax[k].amount) || 0) : t; }, 0);
  }
  function kvRow(label, value, cls) { return '<span' + (cls ? ' class="' + cls + '"' : '') + '>' + label + '</span><span class="fig-sm' + (cls ? ' ' + cls : '') + '">' + value + '</span>'; }
  function warnList(f) {
    var w = [];
    if (f.missing) w.push(f.missing + ' shift' + (f.missing === 1 ? '' : 's') + ' without gross fares — using earnings after fees instead, so GST on sales is understated.');
    if (f.noReceipt) w.push(f.noReceipt + ' business expense' + (f.noReceipt === 1 ? '' : 's') + ' not marked "tax invoice kept" — you can only claim GST credits with a tax invoice.');
    return w.length ? '<div class="notice">' + w.map(esc).join('<br>') + '</div>' : '';
  }
  function logbookSummary() {
    var list = state.logbook.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var biz = 0, priv = 0;
    list.forEach(function (l) { var k = Math.max(0, l.odoEnd - l.odoStart); if (l.kind === 'private') priv += k; else biz += k; });
    var first = list.length ? list[0].date : null, weeks = 0;
    if (first) weeks = Math.min(12, Math.floor((parseYmd(ymd(now())) - parseYmd(first)) / 864e5 / 7) + 1);
    return { list: list, biz: biz, priv: priv, total: biz + priv, pct: biz + priv ? biz / (biz + priv) : 0, first: first, weeks: weeks };
  }

  function viewMoney(d) {
    var key = ymd(d), ws = weekStart(d), list = inWeek(state.expenses, ws).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var spent = sum(list, function (e) { return e.amount; });
    var taxKey = 'w' + ymd(ws), taxDone = Number((state.tax[taxKey] || {}).amount) || 0, wr = weekReserve(ws);
    var taxGoal = wr.days ? wr.target : TAX_WEEKLY;

    var taxCard = '<section class="card a-money"><div style="display:flex;gap:16px;align-items:center">' +
      ring(taxDone / taxGoal, 'money', 'Tax', Math.round(clamp(taxDone / taxGoal) * 100) + '%', true, 'Tax account ' + money(taxDone, true) + ' of ' + money(taxGoal, true)) +

      '<span class="caption">' + (wr.days ? money(wr.receipts, true) + ' earned over ' + wr.days + ' day' + (wr.days === 1 ? '' : 's') + '. ' : '') + 'Plan: ' + money(TAX_WEEKLY, true) + ' a week at ' + money(DAY_TARGET) + ' a day, plus 38.2% of anything above it.</span></div></div>' +
      '<button class="btn btn-secondary btn-small" data-act="tax" style="background:var(--money-track)">Record set-aside</button></section>';

    var rows = list.length ? list.map(function (e) {
      var pct = e.businessPct == null ? 100 : e.businessPct;
      var sub = shortDate(e.date) + ' · ' + (pct > 0 ? pct + '% business' : 'personal') + (Number(e.gst) > 0 ? ' · GST ' + money(e.gst, true) : ' · no GST') +

    }).join('') : '<div class="empty-state">' + illo('receipt') + '<p class="empty">No expenses this week yet. Charging, washes and Splend go here.</p></div>';
    var expCard = '<section class="card"><div class="card-head"><h3 class="heading">Expenses this week</h3><span class="fig-sm">' + money(spent, true) + '</span></div><div class="list">' + rows + '</div>' +
      '<button class="btn btn-primary btn-small" data-act="expense">' + icon('plus', 18) + 'Log expense</button></section>';

    // BAS — current quarter plus earlier quarters with entries
    var cq = quarterOf(key), r = qRange(cq.fy, cq.q), f = taxFigures(r[0], r[1]), qSet = setAsideBetween(r[0], r[1]);
    var basCard = '<section class="card"><div class="card-head"><h3 class="heading">BAS · ' + Q_NAMES[cq.q] + ' ' + (cq.q <= 2 ? cq.fy : cq.fy + 1) + '</h3><span class="caption">Due ' + qDue(cq.fy, cq.q) + '</span></div>' +
      warnList(f) +
      '<div class="kv">' +
      kvRow('G1 Total sales (gross fares, incl. GST)', money(f.g1, true)) +
      kvRow('1A GST on sales', money(f.a1, true)) +
      kvRow('1B GST credits — Uber fees', money(f.fees / 11, true)) +
      kvRow('1B GST credits — business expenses', money(f.b1 - f.fees / 11, true)) +
      kvRow('1B GST credits — total', money(f.b1, true)) +
      kvRow(f.gstOwing >= 0 ? 'GST to pay (1A − 1B)' : 'GST refund (1B − 1A)', money(Math.abs(f.gstOwing), true), 'total') +
      '</div><span class="caption">' + f.shifts + ' shift' + (f.shifts === 1 ? '' : 's') + ' this quarter. Tax account set aside this quarter: ' + money(qSet, true) + '. Lodge with the real Uber tax summary and invoices.</span>';
    var past = {};
    state.shifts.concat(state.expenses).forEach(function (x) { var q = quarterOf(x.date); var k = q.fy + '-' + q.q; if (!(q.fy === cq.fy && q.q === cq.q)) past[k] = q; });
    var pastKeys = Object.keys(past).sort().reverse();
    if (pastKeys.length) {
      basCard += '<div class="list">' + pastKeys.map(function (k) {
        var q = past[k], rr = qRange(q.fy, q.q), ff = taxFigures(rr[0], rr[1]);
        return '<div class="row"><div class="row-main"><span class="row-title">' + Q_NAMES[q.q] + ' ' + (q.q <= 2 ? q.fy : q.fy + 1) + '</span><span class="row-sub">G1 ' + money(ff.g1, true) + ' · 1A ' + money(ff.a1, true) + ' · 1B ' + money(ff.b1, true) + ' · due ' + qDue(q.fy, q.q) + '</span></div>' +
          '<span class="fig-sm">' + (ff.gstOwing >= 0 ? '' : '−') + money(Math.abs(ff.gstOwing), true) + '</span><span></span></div>';

    }
    basCard += '</section>';

    // Income tax — current financial year
    var fy = fyStartYear(key), fa = fy + '-07-01', fb = (fy + 1) + '-07-01', t = taxFigures(fa, fb), it = incomeTax(t.profit, fy);
    var daysLeft = Math.max(0, Math.round((parseYmd(fb) - parseYmd(key)) / 864e5) - 1);
    var planDaily = 51967.42 / 364, projProfit = t.profit + daysLeft * planDaily, pit = incomeTax(projProfit, fy);
    var fySet = setAsideBetween(fa, fb);
    var itCard = '<section class="card"><div class="card-head"><h3 class="heading">Income tax · ' + fyLabel(fy) + '</h3><span class="caption">1 Jul – 30 Jun</span></div>' +
      '<div class="kv">' +
      kvRow('Business income (fares excl. GST)', money(t.income, true)) +
      kvRow('Uber fees (excl. GST)', '−' + money(t.fees - t.fees / 11, true)) +
      kvRow('Business expenses (excl. GST, business share)', '−' + money(t.deductions - (t.fees - t.fees / 11), true)) +
      kvRow('Taxable profit so far', money(t.profit, true), 'total') +
      kvRow('Income tax on that (after LITO ' + money(it.lito, true) + ')', money(it.net, true)) +
      kvRow('Medicare levy', money(it.medicare, true)) +
      kvRow('Tax so far', money(it.net + it.medicare, true), 'total') +
      '</div>' +
      '<div class="kv">' +
      kvRow('Projected profit to 30 June (plan pace for ' + daysLeft + ' more days)', money(projProfit, 0)) +
      kvRow('Projected income tax + Medicare', money(pit.net + pit.medicare, 0), 'total') +
      '</div>' +
      '<span class="caption">Tax account this financial year: ' + money(fySet, true) + ' (covers GST and income tax). Illustrative resident rates (' + (fy >= 2027 ? '14%' : '15%') + ' / 30%), tax-free threshold, no other income or study loan. Confirm with a registered tax agent.</span></section>';

    // Logbook
    var lb = logbookSummary();
    var lbRows = lb.list.slice(-5).reverse().map(function (l) {
      return '<div class="row"><div class="row-main"><span class="row-title">' + shortDate(l.date) + ' · ' + (l.kind === 'private' ? 'Private' : 'Business') + '</span><span class="row-sub">' +
        l.odoStart.toLocaleString('en-AU') + ' → ' + l.odoEnd.toLocaleString('en-AU') + (l.purpose ? ' · ' + esc(l.purpose) : '') + '</span></div>' +
        '<span class="fig-sm">' + Math.max(0, l.odoEnd - l.odoStart).toLocaleString('en-AU') + ' km</span><button class="link-btn" data-act="del" data-c="logbook" data-id="' + esc(l.id) + '" aria-label="Delete logbook entry">Delete</button></div>';
    }).join('');
    var lbCard = '<section class="card"><div class="card-head"><h3 class="heading">Vehicle logbook</h3><span class="caption">' + (lb.first ? 'Week ' + lb.weeks + ' of 12' : 'Not started') + '</span></div>' +
      (state.dbV2 ? '' : '<div class="notice">Trips can\'t be saved until the database update is done.</div>') +
      segBar('work', 12, lb.weeks, '12-week logbook period', lb.first ? 'from ' + shortDate(lb.first) : '0 / 12') +
      '<div class="kv">' + kvRow('Business km', lb.biz.toLocaleString('en-AU')) + kvRow('Private km', lb.priv.toLocaleString('en-AU')) +
      kvRow('Business use', lb.total ? Math.round(lb.pct * 1000) / 10 + '% (plan: 80%)' : '–', 'total') + '</div>' +
      (lbRows ? '<div class="list">' + lbRows + '</div>' : '<div class="empty-state">' + illo('gauge') + '<p class="empty">Add odometer readings when you log a shift, and log every private trip here.</p></div>') +
      '<div class="btn-row"><button class="btn btn-secondary btn-small" data-act="trip" data-v="business">Business trip</button><button class="btn btn-secondary btn-small" data-act="trip" data-v="private">Private trip</button></div>' +
      '<span class="caption">ATO logbook: 12 continuous weeks covering every trip, with date, odometer start and end, km and purpose. Keep it for 5 years; it stays valid for 5 years.</span></section>';

    // Budget plan
    var bizT = BUDGET_BIZ.reduce(function (s, b) { return s + b[1]; }, 0), taxT = BUDGET_TAX.reduce(function (s, b) { return s + b[1]; }, 0), perT = BUDGET_PERSONAL.reduce(function (s, b) { return s + b[1]; }, 0);
    function lines(arr) { return arr.map(function (b) { return kvRow(esc(b[0]), '−' + money(b[1], true)); }).join(''); }
    var budgetCard = '<section class="card"><div class="card-head"><h3 class="heading">Weekly budget</h3><span class="caption">At ' + money(DAY_TARGET) + ' a day</span></div>' +
      '<div class="kv">' + kvRow('Receipts after fees (' + money(DAY_TARGET) + ' × 7)', money(WEEK_TARGET, true), 'total') +
      lines(BUDGET_BIZ) + lines(BUDGET_TAX) + kvRow('Available after business costs and tax', money(WEEK_TARGET - bizT - taxT, true), 'total') +
      lines(BUDGET_PERSONAL) + kvRow('Cash extra (unlisted costs and savings)', money(WEEK_TARGET - bizT - taxT - perT, true), 'total') + '</div>' +
      '<span class="caption">Break-even: ' + money(DAY_BREAKEVEN, true) + ' a day.</span></section>';

    return hero('money', 'Money', 'Earnings, tax, BAS and the weekly budget.') + notice() + taxCard + expCard + basCard + itCard + lbCard + budgetCard +
      appearanceCard() +
      '<section class="card"><div class="card-head"><h3 class="heading">Backup</h3><span class="caption">App version ' + APP_VERSION + '</span></div><p class="body" style="margin:0">Saves a copy of every entry to a file on your phone, for safekeeping.</p><button class="btn btn-secondary btn-small" data-act="export">Back up my data</button></section>' +

  /* ---------------- sheets (forms) ---------------- */
  var scrim = document.getElementById('sheet-scrim'), sheet = document.getElementById('sheet'), lastFocus = null;
  function openSheet(html) { lastFocus = document.activeElement; sheet.innerHTML = html; scrim.classList.add('open'); var f = sheet.querySelector('input,select,button'); if (f) f.focus(); }
  function closeSheet() { scrim.classList.remove('open'); sheet.innerHTML = ''; sheet.onchange = null; sheet.onclick = null; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  scrim.addEventListener('click', function (e) { if (e.target === scrim) closeSheet(); });
  sheet.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  function shiftSheet() {
    var d = now(), lastOdo = state.logbook.reduce(function (m, l) { return Math.max(m, l.odoEnd || 0); }, 0);
    openSheet('<h2 class="title" id="sheet-title">Log shift</h2>' +
      '<form id="f-shift" style="display:flex;flex-direction:column;gap:14px" novalidate>' +
      '<div class="field"><label for="s-date">Date</label><input id="s-date" type="date" value="' + ymd(d) + '" required></div>' +
      '<div class="field"><label for="s-nh">Normal-rate driving</label><div class="two"><input id="s-nh" type="number" inputmode="numeric" min="0" max="16" value="5" aria-label="Hours"><input id="s-nm" type="number" inputmode="numeric" min="0" max="59" step="5" value="50" aria-label="Minutes"></div><span class="hint">Hours and minutes online, not counting the homeward hour. Plan: 5 h 50.</span></div>' +

      '<div class="field"><label for="s-f">Uber fees ($)</label><input id="s-f" type="number" inputmode="decimal" min="0" step="0.01" placeholder="service fee"></div></div>' +
      '<div class="field"><label for="s-r">Earnings after fees ($)</label><input id="s-r" type="number" inputmode="decimal" min="0" step="0.01" placeholder="e.g. 245.00" required><span class="hint">Fills in from gross fares minus fees. Gross fares and fees are needed for the BAS — they are in the Uber app under the trip or weekly statement.</span></div>' +
      '<div class="two"><div class="field"><label for="s-o1">Odometer start</label><input id="s-o1" type="number" inputmode="numeric" min="0" step="1"' + (lastOdo ? ' placeholder="last ' + lastOdo + '"' : '') + '></div>' +
      '<div class="field"><label for="s-o2">Odometer end</label><input id="s-o2" type="number" inputmode="numeric" min="0" step="1"></div></div>' +
      '<span class="hint" style="margin-top:-8px">Odometer readings add a business entry to the logbook and fill in the kilometres.</span>' +
      '<div class="field"><label for="s-n">Note</label><input id="s-n" type="text" maxlength="80"></div>' +
      '<p class="caption" id="s-err" role="alert" style="margin:0;color:var(--money-label)"></p>' +
      '<div class="btn-row"><button type="button" class="btn btn-secondary" data-act="close">Cancel</button><button type="submit" class="btn btn-primary">Save shift</button></div></form>');
    var gEl = document.getElementById('s-g'), fEl = document.getElementById('s-f'), rEl = document.getElementById('s-r');
    function autoNet() { var g = parseFloat(gEl.value), f = parseFloat(fEl.value); if (g >= 0 && f >= 0) rEl.value = (Math.round((g - f) * 100) / 100).toFixed(2); }
    gEl.addEventListener('input', autoNet); fEl.addEventListener('input', autoNet);
    document.getElementById('f-shift').addEventListener('submit', function (e) {
      e.preventDefault();
      var err = document.getElementById('s-err');
      var r = parseFloat(rEl.value), date = document.getElementById('s-date').value;
      var g = gEl.value === '' ? null : parseFloat(gEl.value), f = fEl.value === '' ? null : parseFloat(fEl.value);
      var o1 = parseInt(document.getElementById('s-o1').value, 10), o2 = parseInt(document.getElementById('s-o2').value, 10);
      var nmin = (parseInt(document.getElementById('s-nh').value, 10) || 0) * 60 + (parseInt(document.getElementById('s-nm').value, 10) || 0);
      if (!date) { err.textContent = 'Pick a date.'; return; }
      if (!(r >= 0)) { err.textContent = 'Enter the earnings after fees, e.g. 245.'; return; }
      if ((o1 >= 0) !== (o2 >= 0) || (o1 >= 0 && o2 < o1)) { err.textContent = 'Enter both odometer readings, with the end higher than the start.'; return; }
      var hasOdo = o1 >= 0 && o2 >= o1;
      var data = { date: date, normalMin: nmin, homeMin: parseInt(document.getElementById('s-hm').value, 10) || 0, receipts: Math.round(r * 100) / 100,

        km: hasOdo ? o2 - o1 : 0, note: document.getElementById('s-n').value.trim(), createdAt: new Date().toISOString() };
      save('shifts', null, data).then(function () {
        if (hasOdo && (state.dbV2 || !sb)) return save('logbook', null, { date: date, odoStart: o1, odoEnd: o2, kind: 'business', purpose: 'Uber shift' });
      }).then(function () { closeSheet(); toast('Shift saved'); });
    });
  }

      '<div class="field"><label for="e-n">Note</label><input id="e-n" type="text" maxlength="80" placeholder="e.g. Evie charger, Rhodes"></div>' +
      '<p class="caption" id="e-err" role="alert" style="margin:0;color:var(--money-label)"></p>' +
      '<div class="btn-row"><button type="button" class="btn btn-secondary" data-act="close">Cancel</button><button type="submit" class="btn btn-primary">Save expense</button></div></form>');
    var cat = document.getElementById('e-cat'), amt = document.getElementById('e-amt'), pct = document.getElementById('e-pct'), gst = document.getElementById('e-gst'), calc = document.getElementById('e-calc');
    var gstTouched = false;
    function update() {
      var info = catInfo(cat.value), a = parseFloat(amt.value) || 0;
      if (!gstTouched) gst.value = info[2] && a > 0 ? (Math.round(a / 11 * 100) / 100).toFixed(2) : '';
      var p = Math.max(0, Math.min(100, parseFloat(pct.value) || 0)) / 100, g = parseFloat(gst.value) || 0;
      calc.textContent = a > 0 ? (p > 0 ? 'GST credit ' + money(g * p, true) + ' · tax deduction ' + money((a - g) * p, true) : 'Personal — not claimed.') : '';
    }
    cat.addEventListener('change', function () { pct.value = catInfo(cat.value)[1]; update(); });
    amt.addEventListener('input', update); pct.addEventListener('input', update);
    gst.addEventListener('input', function () { gstTouched = true; update(); });
    document.getElementById('f-exp').addEventListener('submit', function (e) {
      e.preventDefault();
      var a = parseFloat(amt.value), date = document.getElementById('e-date').value, p = parseInt(pct.value, 10), g = parseFloat(gst.value) || 0;
      if (!date || !(a > 0)) { document.getElementById('e-err').textContent = 'Enter a date and an amount above $0.'; return; }
      if (!(p >= 0 && p <= 100)) { document.getElementById('e-err').textContent = 'Business share must be between 0 and 100.'; return; }
      if (g > a / 11 + 0.01) { document.getElementById('e-err').textContent = 'GST can be at most 1/11 of the amount (' + money(a / 11, true) + ').'; return; }
      save('expenses', null, { date: date, category: cat.value, amount: Math.round(a * 100) / 100, businessPct: p, gst: Math.round(g * 100) / 100,
        receiptKept: document.getElementById('e-rec').checked, note: document.getElementById('e-n').value.trim(), createdAt: new Date().toISOString() })
        .then(function () { closeSheet(); toast('Expense saved'); });
    });
  }

  function tripSheet(kind) {
    var d = now(), lastOdo = state.logbook.reduce(function (m, l) { return Math.max(m, l.odoEnd || 0); }, 0);
    openSheet('<h2 class="title" id="sheet-title">' + (kind === 'private' ? 'Private trip' : 'Business trip') + '</h2>' +
      '<form id="f-trip" style="display:flex;flex-direction:column;gap:14px" novalidate>' +
      '<div class="field"><label for="tr-date">Date</label><input id="tr-date" type="date" value="' + ymd(d) + '" required></div>' +
      '<div class="two"><div class="field"><label for="tr-o1">Odometer start</label><input id="tr-o1" type="number" inputmode="numeric" min="0" step="1" value="' + (lastOdo || '') + '"></div>' +
      '<div class="field"><label for="tr-o2">Odometer end</label><input id="tr-o2" type="number" inputmode="numeric" min="0" step="1"></div></div>' +
      '<div class="field"><label for="tr-p">Purpose</label><input id="tr-p" type="text" maxlength="80" placeholder="' + (kind === 'private' ? 'e.g. groceries, family visit' : 'e.g. Uber shift, car wash, charging') + '"></div>' +
      '<p class="caption" id="tr-err" role="alert" style="margin:0;color:var(--money-label)"></p>' +
      '<div class="btn-row"><button type="button" class="btn btn-secondary" data-act="close">Cancel</button><button type="submit" class="btn btn-primary">Save trip</button></div></form>');
    document.getElementById('f-trip').addEventListener('submit', function (e) {
      e.preventDefault();
      var date = document.getElementById('tr-date').value, o1 = parseInt(document.getElementById('tr-o1').value, 10), o2 = parseInt(document.getElementById('tr-o2').value, 10);
      if (!date || !(o1 >= 0) || !(o2 > o1)) { document.getElementById('tr-err').textContent = 'Enter a date and both odometer readings, with the end higher than the start.'; return; }
      if (sb && !state.dbV2) { document.getElementById('tr-err').textContent = 'Trips can\'t be saved until the database update is done.'; return; }
      save('logbook', null, { date: date, odoStart: o1, odoEnd: o2, kind: kind, purpose: document.getElementById('tr-p').value.trim() || (kind === 'private' ? 'Private' : 'Business') })
        .then(function () { closeSheet(); toast('Trip saved'); });
    });
  }

  function taxSheet() {
    var ws = weekStart(now()), key = 'w' + ymd(ws), cur = Number((state.tax[key] || {}).amount) || 0, wr = weekReserve(ws);
    var goal = wr.days ? Math.round(wr.target * 100) / 100 : TAX_WEEKLY;
    openSheet('<h2 class="title" id="sheet-title">Tax account</h2><p class="body" style="margin:0">How much have you moved to the tax account for the week starting Sunday ' + ws.getDate() + ' ' + MONTHS[ws.getMonth()] + '? ' +
      (wr.days ? 'Based on ' + money(wr.receipts, true) + ' earned over ' + wr.days + ' day' + (wr.days === 1 ? '' : 's') + ', set aside ' + money(goal, true) + '.' : 'The plan figure for a full week is ' + money(TAX_WEEKLY, true) + '.') + '</p>' +
      '<form id="f-tax" style="display:flex;flex-direction:column;gap:14px" novalidate><div class="field"><label for="t-amt">Total set aside this week ($)</label><input id="t-amt" type="number" inputmode="decimal" min="0" step="0.01" value="' + (cur || goal) + '"></div>' +
      '<div class="btn-row"><button type="button" class="btn btn-secondary" data-act="close">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div></form>');
    document.getElementById('f-tax').addEventListener('submit', function (e) {
      e.preventDefault(); var a = parseFloat(document.getElementById('t-amt').value) || 0;
      save('tax', key, { amount: Math.round(a * 100) / 100, updatedAt: new Date().toISOString() }).then(function () { closeSheet(); toast('Tax account updated'); });
    });
  }

  function exportData() {
    var stamp = ymd(now());
    var pack = function (tables) {
      var payload = { app: 'Field Notes', version: 1, exportedAt: new Date().toISOString(), account: user ? user.email : null, tables: tables };
      var json = JSON.stringify(payload, null, 2);
      var name = 'field-notes-backup-' + stamp + '.json';
      var file = null;
      try { file = new File([json], name, { type: 'application/json' }); } catch (x) {}
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: name }).catch(function () {});
        return;
      }
      var url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      var a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
      toast('Backup saved: ' + name);
    };
    if (sb && user) {
      Promise.all(['shifts', 'expenses', 'days', 'tax_weeks', 'logbook', 'body', 'assessments', 'subject_results'].map(function (t) { return sb.from(t).select('*').limit(5000); })).then(function (res) {
        if (res.slice(0, 4).some(function (r) { return r.error; })) { toast('Could not read your data for the backup'); return; }
        pack({ shifts: res[0].data, expenses: res[1].data, days: res[2].data, tax_weeks: res[3].data, logbook: res[4].error ? [] : res[4].data, body: res[5].error ? [] : res[5].data, assessments: res[6].error ? [] : res[6].data, subject_results: res[7].error ? [] : res[7].data });
      });
    } else {
      pack({ shifts: state.shifts, expenses: state.expenses, days: state.days, tax_weeks: state.tax, logbook: state.logbook, body: state.body, assessments: state.assessments, subject_results: state.results });
    }
  }

  /* ---------------- actions ---------------- */
  var busy = {};
  function setDay(key, patch) {
    if (busy[key]) return; busy[key] = true;
    var doc = Object.assign({}, dayDoc(key), patch); delete doc.id; doc.updatedAt = new Date().toISOString();
    save('days', key, doc).then(function () { busy[key] = false; }, function () { busy[key] = false; });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act'), key = ymd(now());
    if (act === 'shift') shiftSheet();
    else if (act === 'expense') expenseSheet();
    else if (act === 'tax') taxSheet();
    else if (act === 'trip') tripSheet(b.getAttribute('data-v'));
    else if (act === 'weigh') bodySheet();
    else if (act === 'recipe') recipeSheet(b.getAttribute('data-k'));
    else if (act === 'shop') shopSheet();
    else if (act === 'assess') assessSheet(b.getAttribute('data-id'));
    else if (act === 'assess-new') assessSheet(null, b.getAttribute('data-code'));
    else if (act === 'result') resultSheet(b.getAttribute('data-code'));
    else if (act === 'ms-done') { var as = state.assessments.filter(function (x) { return x.id === b.getAttribute('data-id'); })[0]; if (as) { var cp = JSON.parse(JSON.stringify(as)); cp.plan[+b.getAttribute('data-i')].done = true; if (cp.status === 'todo') cp.status = 'doing'; saveAssess(cp).then(function () { toast('Step done'); }); } }
    else if (act === 'close') closeSheet();
    else if (act === 'skin') { try { localStorage.setItem('fn-skin', b.getAttribute('data-v')); } catch (x) {} if (window.fnApplyTheme) window.fnApplyTheme(true); render(); }
    else if (act === 'theme') { try { localStorage.setItem('fn-theme', b.getAttribute('data-v')); } catch (x) {} if (window.fnApplyTheme) window.fnApplyTheme(true); render(); }
    else if (act === 'export') exportData();
    else if (act === 'signout') { if (sb) sb.auth.signOut(); }
    else if (act === 'ex') { var v = b.getAttribute('data-v'); setDay(key, { exercise: v || null }); toast(v ? (v === 'gym' ? 'Gym logged' : 'Walk logged') : 'Exercise cleared'); }
    else if (act === 'study') { var add = parseInt(b.getAttribute('data-v'), 10); var m = Math.max(0, (Number(dayDoc(key).studyMin) || 0) + add); setDay(key, { studyMin: m }); toast('Study today: ' + hm(m)); }
    else if (act === 'del') { remove(b.getAttribute('data-c'), b.getAttribute('data-id')).then(function () { toast('Deleted'); }); }
    else if (act === 'tab') { state.tab = b.getAttribute('data-v'); try { location.hash = state.tab === 'today' ? '' : state.tab; } catch (x) {} render(true); window.scrollTo(0, 0); }
  });

  var toastTimer;
  function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800); }

  /* ---------------- render ---------------- */
  var TABS = [['today', 'Today', 'home'], ['work', 'Work', 'car'], ['study', 'Study', 'book'], ['health', 'Health', 'heart'], ['money', 'Money', 'wallet']];
  var introTimer;
  function render(intro) {
    var d = now(), viewEl = document.getElementById('view');
    if (intro === true) { viewEl.classList.add('intro'); clearTimeout(introTimer); introTimer = setTimeout(function () { viewEl.classList.remove('intro'); }, 2000); }
    document.getElementById('nav').innerHTML = TABS.map(function (t) {
      return '<button type="button" data-act="tab" data-v="' + t[0] + '"' + (state.tab === t[0] ? ' aria-current="page"' : '') + '>' + icon(t[2]) + t[1] + '</button>';
    }).join('');
    var v = state.tab;
    document.getElementById('view').innerHTML = v === 'work' ? viewWork(d) : v === 'study' ? viewStudy(d) : v === 'health' ? viewHealth(d) : v === 'money' ? viewMoney(d) : viewToday(d);
  }

  var h0 = (location.hash || '').replace('#', '');
  if (['work', 'study', 'health', 'money'].indexOf(h0) >= 0) state.tab = h0;
  window.addEventListener('hashchange', function () { var h = (location.hash || '').replace('#', ''); state.tab = ['work', 'study', 'health', 'money'].indexOf(h) >= 0 ? h : 'today'; render(); });
  function checkUpdate() {
    if (location.protocol.indexOf('http') !== 0) return;
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : null; }).then(function (v) {
      if (!v || !v.version || v.version === APP_VERSION) return;
      var key = 'fn-updated-' + v.version;
      try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch (x) {}
      fetch('./', { cache: 'reload' }).catch(function () {}).then(function () {
        fetch('config.js', { cache: 'reload' }).catch(function () {}).then(function () { location.reload(); });
      });
    }).catch(function () {});
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') checkUpdate(); });
  render(true);
  connect();
  checkUpdate();
  setInterval(function () { if (!scrim.classList.contains('open')) render(); }, 30000);
})();
</script>
</body>
</html>
